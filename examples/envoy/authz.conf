# examples/envoy/authz.conf — the authz app as Envoy's ext_authz backend.
#
# The SAME app as examples/openresty-authz (loaded from there via package.path)
# with two demo-topology differences: it listens on 8081 (Envoy's authz
# cluster; the guestbook keeps 8080), and its seed includes a "guestbook"
# resource under tenant acme — the resource the CHECK route maps /api/messages
# to. Run from the repo root with THIS example dir as the prefix, so its log
# lives here:
#
#     mkdir -p examples/envoy/logs
#     openresty -p "$PWD/examples/envoy" -c authz.conf

daemon off;
worker_processes 1;                 # one worker: one kernel boot, one replay
pid logs/nginx-authz.pid;
error_log logs/error-authz.log info;

events { worker_connections 256; }

http {
    access_log logs/access-authz.log;

    types { application/json json; text/plain txt; }
    default_type application/json;

    # Repo root and the authz example dir on package.path: the prefix is
    # .../examples/envoy/, so ../../ is the repo root and ../openresty-authz/
    # is where app.lua / store.lua / authz.shen / app.shen live.
    init_by_lua_block {
        local prefix = ngx.config.prefix()
        package.path = prefix .. "../../?.lua;"
                    .. prefix .. "../openresty-authz/?.lua;" .. package.path
    }

    # Boot Shen ONCE per worker, open the durable store, replay its log, and
    # seed the demo world on first boot only. Identical to the openresty-authz
    # config except for the extra "guestbook" resource + memberships.
    init_worker_by_lua_block {
        local app   = require("app")
        local Store = require("store")
        local store = Store.new{
            codec   = app.json,
            backend = "file",
            path    = ngx.config.prefix() .. "logs/authz-log.jsonl",
        }
        if store.seq() == 0 then
            store.seed_token("tok-admin", "admin", true)
            store.seed_token("tok-alice", "alice", false)
            store.seed_token("tok-bob",   "bob",   false)
            store.seed_token("tok-carol", "carol", false)
            -- the resource the edge CHECK maps /api/messages to
            store.create("acme", "guestbook", "guestbook access marker")
            store.grant("alice", "acme", "editor")   -- may read AND post
            store.grant("bob",   "acme", "viewer")   -- may read, not post
            -- carol: no membership — denied with a discharge report
        end
        app.use_store(store)
    }

    server {
        listen 8081;

        # Envoy's ext_authz check requests: "<method> /authz<original path>"
        # + the authorization header -> (route "CHECK" Path ...) in Shen.
        location /authz/ {
            content_by_lua_block { require("app").handle() }
        }

        # The app's own JSON API stays reachable (admin: grant/revoke/audit),
        # so you can revoke access and read the durable decision log while
        # Envoy is enforcing at the edge.
        location /api/ {
            content_by_lua_block { require("app").handle() }
        }
    }
}
